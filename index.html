<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerro Gordo World Cup Sweepstake Live Draw</title>

<style>
body{font-family:Arial;background:#2b2b2b;margin:0;padding:20px}
.container{max-width:1200px;margin:auto}
h1,h2{text-align:center;color:white}

button{padding:12px 24px;margin:10px;border:none;border-radius:10px;cursor:pointer}
.wheels{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.wheel{background:white;padding:30px;border-radius:20px;text-align:center}
.value{font-size:28px;font-weight:bold}

table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border:1px solid #ddd}

#resultFlash{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);
color:white;z-index:9999;justify-content:center;align-items:center;
flex-direction:column;text-align:center;opacity:0;transition:1s;
}

#countdownScreen{
position:fixed;inset:0;background:#000;color:#ffd700;
display:flex;flex-direction:column;justify-content:center;
align-items:center;font-size:80px;z-index:10000;transition:1s;
}
</style>
</head>

<body>

<div class="container">
<h1>Cerro Gordo World Cup Sweepstake Live Draw</h1>

<button onclick="drawNext()">Start Draw</button>

<div class="wheels">
<div class="wheel"><div id="playerWheel" class="value">—</div></div>
<div class="wheel"><div id="potAWheel" class="value">—</div></div>
<div class="wheel"><div id="potBWheel" class="value">—</div></div>
</div>

<h2><span id="progress">0</span>/24</h2>

<table>
<tbody id="resultsBody"></tbody>
</table>

<button onclick="copyResults()">Copy</button>
<button onclick="downloadPDF()">PDF</button>
</div>

<div id="countdownScreen">
<div style="font-size:40px">Draw Starts In</div>
<div id="countdownTimer"></div>
</div>

<div id="resultFlash">
<div id="flashPlayer" style="font-size:120px;color:#ffd700"></div>
<div id="flashPotA"></div>
<div id="flashPotB"></div>
</div>

<audio id="bgMusic" loop>
<source src="themetune.mp3">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

// TEST TIMER (change back later)
const drawDate = new Date(Date.now() + 10000);

const playersSeed=['Audrey','Ed','Liz','Andy','Carys','Mike','Steve B','Mary','June','Ray','Ian M','Margaret M','Jean','Elaine','Trevor','Sheila','Dave','Roy 1','Roy 2','Maria','Gill','Len','Fiona','Craig'];

const potASeed=['Argentina','Spain','France','England','Portugal','Brazil','Netherlands','Belgium','Germany','Croatia','Morocco','Colombia','Uruguay','Mexico','USA','Switzerland','Senegal','Japan','Iran','South Korea','Australia','Austria','Norway','Canada'];

const potBSeed=['Paraguay','Algeria','Egypt','Ghana',"Cote d'Ivoire",'Saudi Arabia','Qatar','Tunisia','Turkey','Czech Republic','Scotland','Sweden','South Africa','New Zealand','Panama','Haiti','Curaçao','Cape Verde','Jordan','Uzbekistan','Iraq','Ecuador','DR Congo','Bosnia & Herzegovina'];

let players=[...playersSeed], potA=[...potASeed], potB=[...potBSeed];
let drawing=false, paused=false, count=0;

function rand(a){return a[Math.floor(Math.random()*a.length)]}

function spin(id,arr,val,cb){
let t=0,el=document.getElementById(id);
let i=setInterval(()=>{
el.textContent=rand(arr);
if(++t>20){clearInterval(i);el.textContent=val;cb();}
},100);
}

function drawNext(){
if(drawing||paused||!players.length)return;

document.getElementById('resultFlash').style.display='none';

drawing=true;

let p=rand(players),a=rand(potA),b=rand(potB);

spin('playerWheel',players,p,()=>{
spin('potAWheel',potA,a,()=>{
spin('potBWheel',potB,b,()=>{

players=players.filter(x=>x!==p);
potA=potA.filter(x=>x!==a);
potB=potB.filter(x=>x!==b);
count++;

resultsBody.innerHTML+=`<tr><td>${count}</td><td>${p}</td><td>${a}</td><td>${b}</td></tr>`;
progress.textContent=count;

flashPlayer.textContent=p;
flashPotA.textContent=a;
flashPotB.textContent=b;

let f=resultFlash;
f.style.display='flex';setTimeout(()=>f.style.opacity=1,50);

drawing=false;

setTimeout(()=>{
f.style.opacity=0;
setTimeout(()=>{
f.style.display='none';
if(players.length)drawNext();
},1000);
},2000);

});
});
});
}

// RIGHT CLICK PAUSE
document.addEventListener('contextmenu',e=>{
e.preventDefault();
if(drawing)return;

paused=!paused;

if(!paused && players.length) drawNext();
});

// RESET
document.addEventListener('keydown',e=>{
if(e.key==="r"){location.reload();}
});

// COPY
function copyResults(){
let t="";
document.querySelectorAll("#resultsBody tr").forEach(r=>{
let c=r.children;
t+=`${c[0].innerText}. ${c[1].innerText} - ${c[2].innerText}/${c[3].innerText}\n`;
});
navigator.clipboard.writeText(t);
}

// PDF
function downloadPDF(){
const {jsPDF}=window.jspdf;
let doc=new jsPDF();
let y=20;

document.querySelectorAll("#resultsBody tr").forEach(r=>{
let c=r.children;
doc.text(`${c[0].innerText}. ${c[1].innerText} - ${c[2].innerText}/${c[3].innerText}`,10,y);
y+=8;
});

doc.save("draw.pdf");
}

// COUNTDOWN
setInterval(()=>{
let diff=drawDate-new Date();
if(diff<=0){
countdownScreen.style.display="none";
document.getElementById("bgMusic").play();
drawNext();
return;
}
let s=Math.floor(diff/1000)%60;
let m=Math.floor(diff/60000)%60;
let h=Math.floor(diff/3600000)%24;
let d=Math.floor(diff/86400000);
countdownTimer.textContent=`${d}d ${h}h ${m}m ${s}s`;
},1000);

</script>

</body>
</html>
