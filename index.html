<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerro Gordo World Cup Sweepstake Live Draw</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#2b2b2b;
  margin:0;
  padding:20px;
}
.container{max-width:1200px;margin:auto}
h1,h2{text-align:center;color:white}

.controls{text-align:center;margin:20px 0}
button{
  padding:12px 24px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}
#drawBtn{background:#1d4ed8;color:white}

.wheels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin:20px 0;
}
.wheel{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
}
.value{font-size:28px;font-weight:bold;color:#0b3a75}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}
th,td{
  padding:10px;
  border:1px solid #ddd;
}

/* FLASH */
#resultFlash{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  color:white;
  z-index:9999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  opacity:0;
  transition:opacity 1s ease;
}
</style>
</head>

<body>

<div class="container">
<h1>Cerro Gordo World Cup Sweepstake Live Draw</h1>

<div class="controls">
<button onclick="drawNext()">Start Draw</button>
</div>

<div class="wheels">
<div class="wheel"><h3>Player</h3><div id="playerWheel" class="value">—</div></div>
<div class="wheel"><h3>Pot A</h3><div id="potAWheel" class="value">—</div></div>
<div class="wheel"><h3>Pot B</h3><div id="potBWheel" class="value">—</div></div>
</div>

<h2>Draw Table (<span id="progress">0</span>/24)</h2>

<table>
<thead><tr><th>#</th><th>Player</th><th>Pot A</th><th>Pot B</th></tr></thead>
<tbody id="resultsBody"></tbody>
</table>

<div style="text-align:center;margin-top:20px;">
<button onclick="copyResults()">Copy Results</button>
</div>

</div>
<div id="countdownScreen" style="
  position:fixed;
  inset:0;
  background:#000;
  color:#ffd700;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:80px;
  font-weight:bold;
  z-index:10000;
  text-align:center;
">
  <div id="countdownTimer"></div>
</div>
<!-- FLASH -->
<div id="resultFlash">

  <div id="flashPlayer" style="font-size:160px;color:#ffd700;"></div>

  <div style="display:flex;align-items:center;gap:20px;">
    <img id="flagA" style="height:80px;">
    <div id="flashPotA" style="font-size:110px;"></div>
  </div>

  <div style="display:flex;align-items:center;gap:20px;">
    <img id="flagB" style="height:80px;">
    <div id="flashPotB" style="font-size:110px;"></div>
  </div>

</div>

<audio id="bgMusic" loop>
  <source src="themetune.mp3" type="audio/mpeg">
</audio>

<script>

// DATA
const playersSeed=['Audrey','Ed','Liz','Andy','Carys','Mike','Steve B','Mary','June','Ray','Ian M','Margaret M','Jean','Elaine','Trevor','Sheila','Dave','Roy 1','Roy 2','Maria','Gill','Len','Fiona','Craig'];

const potASeed=['Argentina','Spain','France','England','Portugal','Brazil','Netherlands','Belgium','Germany','Croatia','Morocco','Colombia','Uruguay','Mexico','USA','Switzerland','Senegal','Japan','Iran','South Korea','Australia','Austria','Norway','Canada'];

const potBSeed=['Paraguay','Algeria','Egypt','Ghana',"Cote d'Ivoire",'Saudi Arabia','Qatar','Tunisia','Turkey','Czech Republic','Scotland','Sweden','South Africa','New Zealand','Panama','Haiti','Curaçao','Cape Verde','Jordan','Uzbekistan','Iraq','Ecuador','DR Congo','Bosnia & Herzegovina'];

let players=[...playersSeed], potA=[...potASeed], potB=[...potBSeed];
let count=0, drawing=false, paused=false, musicStarted=false;

// FLAGS
const flags={ "Argentina":"ar","Spain":"es","France":"fr","England":"gb-eng","Portugal":"pt","Brazil":"br","Netherlands":"nl","Belgium":"be","Germany":"de","Croatia":"hr","Morocco":"ma","Colombia":"co","Uruguay":"uy","Mexico":"mx","USA":"us","Switzerland":"ch","Senegal":"sn","Japan":"jp","Iran":"ir","South Korea":"kr","Australia":"au","Austria":"at","Norway":"no","Canada":"ca","Paraguay":"py","Algeria":"dz","Egypt":"eg","Ghana":"gh","Cote d'Ivoire":"ci","Saudi Arabia":"sa","Qatar":"qa","Tunisia":"tn","Turkey":"tr","Czech Republic":"cz","Scotland":"gb-sct","Sweden":"se","South Africa":"za","New Zealand":"nz","Panama":"pa","Haiti":"ht","Curaçao":"cw","Cape Verde":"cv","Jordan":"jo","Uzbekistan":"uz","Iraq":"iq","Ecuador":"ec","DR Congo":"cd","Bosnia & Herzegovina":"ba" };

function randomItem(a){return a[Math.floor(Math.random()*a.length)]}

// SPIN
function spin(id, arr, finalValue, cb){
  let t=0, el=document.getElementById(id);
  let i=setInterval(()=>{
    el.textContent=randomItem(arr);
    if(++t>=30){
      clearInterval(i);
      el.textContent=finalValue;
      cb&&cb();
    }
  },100);
}

// DRAW
function drawNext(){
  if(paused || drawing || !players.length) return;

  document.getElementById('resultFlash').style.display='none';

  ['playerWheel','potAWheel','potBWheel'].forEach(id=>document.getElementById(id).textContent='—');

  let music=document.getElementById('bgMusic');
  if(!musicStarted){music.play();musicStarted=true;}

  drawing=true;

  let p=randomItem(players), a=randomItem(potA), b=randomItem(potB);

  spin('playerWheel',players,p,()=>{
    spin('potAWheel',potA,a,()=>{
      spin('potBWheel',potB,b,()=>{

        players=players.filter(x=>x!==p);
        potA=potA.filter(x=>x!==a);
        potB=potB.filter(x=>x!==b);
        count++;

        document.getElementById('resultsBody').insertAdjacentHTML('beforeend',
          `<tr><td>${count}</td><td>${p}</td><td>${a}</td><td>${b}</td></tr>`);

        document.getElementById('progress').textContent=count;

        document.getElementById('flashPlayer').textContent=p;
        document.getElementById('flashPotA').textContent=a;
        document.getElementById('flashPotB').textContent=b;

        document.getElementById('flagA').src=`https://flagcdn.com/w80/${flags[a]}.png`;
        document.getElementById('flagB').src=`https://flagcdn.com/w80/${flags[b]}.png`;

        const flash=document.getElementById('resultFlash');
        flash.style.display='flex';
        setTimeout(()=>flash.style.opacity='1',50);

        drawing=false;

        setTimeout(()=>{
          flash.style.opacity='0';
          setTimeout(()=>{
            flash.style.display='none';
            if(players.length>0){
              drawNext();
            }else{
              showComplete();
            }
          },1000);
        },3000);

      });
    });
  });
}

// COMPLETE
function showComplete(){
  const flash=document.getElementById('resultFlash');

  document.getElementById('flashPlayer').textContent='🏆 DRAW COMPLETE';
  document.getElementById('flashPotA').textContent='Click to continue';
  document.getElementById('flashPotB').textContent='';

  flash.style.display='flex';
  flash.style.opacity='1';

  flash.onclick=()=>{
    flash.style.opacity='0';
    setTimeout(()=>flash.style.display='none',500);
  };

  document.getElementById('playerWheel').textContent='—';
  document.getElementById('potAWheel').textContent='—';
  document.getElementById('potBWheel').textContent='—';
}

// PAUSE / RESUME
document.addEventListener('contextmenu', e=>{
  e.preventDefault();
  if(drawing) return;

  paused=!paused;
  const flash=document.getElementById('resultFlash');

  if(paused){
    document.getElementById('flashPlayer').textContent='⏸ PAUSED';
    document.getElementById('flashPotA').textContent='Right click to resume';
    document.getElementById('flashPotB').textContent='';
    flash.style.display='flex';
    flash.style.opacity='1';
  }else{
    flash.style.opacity='0';
    setTimeout(()=>{
      flash.style.display='none';
      if(players.length>0){
        drawNext();
      }
    },500);
  }
});

// RESET
document.addEventListener('keydown', e=>{
  if(e.key.toLowerCase()==='r'){
    if(confirm('Reset draw?')) resetAll();
  }
});

function resetAll(){
  players=[...playersSeed];
  potA=[...potASeed];
  potB=[...potBSeed];
  count=0;
  paused=false;
  drawing=false;
  musicStarted=false;

  let music=document.getElementById('bgMusic');
  music.pause();
  music.currentTime=0;

  document.getElementById('resultsBody').innerHTML='';
  document.getElementById('progress').textContent='0';
  document.getElementById('resultFlash').style.display='none';

  setTimeout(()=>{
    document.getElementById('playerWheel').textContent='—';
    document.getElementById('potAWheel').textContent='—';
    document.getElementById('potBWheel').textContent='—';
  },10);
}

// COPY
function copyResults(){
  let rows=document.querySelectorAll('#resultsBody tr');
  let text="Cerro Gordo World Cup Sweepstake Results\n\n";

  rows.forEach(row=>{
    let cols=row.querySelectorAll('td');
    text+=`${cols[0].innerText}. ${cols[1].innerText} - ${cols[2].innerText} / ${cols[3].innerText}\n`;
  });

  navigator.clipboard.writeText(text).then(()=>{
    alert("Results copied!");
  });
}
// SET YOUR DRAW DATE
const drawDate = new Date(Date.now() + 10000);

function updateCountdown(){
  const now = new Date();
  const diff = drawDate - now;

  const screen = document.getElementById('countdownScreen');
  const timer = document.getElementById('countdownTimer');

  if(diff <= 0){
    // ⏱️ time reached
    screen.style.opacity='0';
#countdownScreen{
  transition:opacity 1s ease;
}
    setTimeout(()=>{
      timer.innerHTML = "DRAW WILL START IN 1 MIN";
      screen.style.opacity='1';

      setTimeout(()=>{
        screen.style.opacity='0';
        setTimeout(()=>{
          screen.style.display='none';
        },1000);
      },3000);

    },1000);

    clearInterval(countdownInterval);
    return;
  }

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const mins = Math.floor((diff / (1000*60)) % 60);
  const secs = Math.floor((diff / 1000) % 60);

  timer.innerHTML = `
    ${days}d ${hours}h ${mins}m ${secs}s
  `;
}

const countdownInterval = setInterval(updateCountdown,1000);
updateCountdown();
</script>

</body>
</html>
