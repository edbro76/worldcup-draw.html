<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerro Gordo World Cup Sweepstake Live Draw</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{font-family:Arial;background:#2b2b2b;margin:0;padding:20px}
.container{max-width:1200px;margin:auto}
h1,h2{text-align:center;color:white}

.controls{text-align:center;margin:20px 0}
button{padding:12px 24px;border:none;border-radius:10px;cursor:pointer;background:#ffd700;font-weight:bold}

.wheels{display:flex;justify-content:center;gap:30px;margin:30px 0}
.wheel{background:white;padding:25px 40px;border-radius:20px;text-align:center;min-width:220px}
.value{font-size:30px;font-weight:bold;color:#0b3a75}

table{width:100%;border-collapse:collapse;background:white}
th,td{padding:12px;border:1px solid #ddd;text-align:center}

/* FLASH */
#resultFlash{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);
  z-index:9999;color:white;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;opacity:0;transition:opacity 1s;
}
#flashPlayer{font-size:140px;color:#ffd700;margin-bottom:20px}
.flashRow{display:flex;align-items:center;gap:20px;font-size:80px}
.flashRow img{height:80px}

/* COUNTDOWN */
#countdownScreen{
  position:fixed;inset:0;background:black;color:#ffd700;
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;z-index:10000;text-align:center;
}

/* END MESSAGE */
#endMessage{
  display:none;position:fixed;inset:0;background:black;color:#ffd700;
  z-index:10001;justify-content:center;align-items:center;
  flex-direction:column;font-size:100px;text-align:center;
}
</style>
</head>

<body onclick="startCountdown()">

<div class="container">
<h1>Cerro Gordo World Cup Sweepstake Live Draw</h1>

<div class="wheels">
<div class="wheel"><div>Player</div><div id="playerWheel" class="value">—</div></div>
<div class="wheel"><div>Pot A</div><div id="potAWheel" class="value">—</div></div>
<div class="wheel"><div>Pot B</div><div id="potBWheel" class="value">—</div></div>
</div>

<h2>Draw Table (<span id="progress">0</span>/24)</h2>

<table id="resultsTable">
<thead><tr><th>#</th><th>Player</th><th>Pot A</th><th>Pot B</th></tr></thead>
<tbody id="resultsBody"></tbody>
</table>

<div class="controls">
<button onclick="downloadPDF()">Download PDF</button>
</div>

</div>

<!-- COUNTDOWN -->
<div id="countdownScreen">
  <div style="font-size:60px;margin-bottom:20px;">Draw Starting Soon</div>
  <div id="countdownTimer" style="font-size:90px;"></div>
</div>

<!-- FLASH -->
<div id="resultFlash">
  <div id="flashPlayer"></div>
  <div class="flashRow"><img id="flagA"><div id="flashPotA"></div></div>
  <div class="flashRow"><img id="flagB"><div id="flashPotB"></div></div>
</div>

<!-- END -->
<div id="endMessage">
  <div>🏆 DRAW COMPLETE</div>
  <div style="font-size:40px;margin-top:20px;">Results below</div>
</div>

<audio id="bgMusic" loop>
  <source src="themetune.mp3" type="audio/mpeg">
</audio>

<script>

// ===== DATE (SET YOUR REAL DATE HERE) =====
const drawDate = new Date("May 24, 2026 19:00:00");

// ===== STATE =====
let players=['Audrey','Ed','Liz','Andy','Carys','Mike','Steve B','Mary','June','Ray','Ian M','Margaret M','Jean','Elaine','Trevor','Sheila','Dave','Roy 1','Roy 2','Maria','Gill','Len','Fiona','Craig'];
let potA=['Argentina','Spain','France','England','Portugal','Brazil','Netherlands','Belgium','Germany','Croatia','Morocco','Colombia','Uruguay','Mexico','USA','Switzerland','Senegal','Japan','Iran','South Korea','Australia','Austria','Norway','Canada'];
let potB=['Paraguay','Algeria','Egypt','Ghana',"Cote d'Ivoire",'Saudi Arabia','Qatar','Tunisia','Turkey','Czech Republic','Scotland','Sweden','South Africa','New Zealand','Panama','Haiti','Curaçao','Cape Verde','Jordan','Uzbekistan','Iraq','Ecuador','DR Congo','Bosnia & Herzegovina'];

let count=0, drawing=false, musicStarted=false;

// FLAGS
const flags={Argentina:"ar",Spain:"es",France:"fr",England:"gb-eng",Portugal:"pt",Brazil:"br",Netherlands:"nl",Belgium:"be",Germany:"de",Croatia:"hr",Morocco:"ma",Colombia:"co",Uruguay:"uy",Mexico:"mx",USA:"us",Switzerland:"ch",Senegal:"sn",Japan:"jp",Iran:"ir","South Korea":"kr",Australia:"au",Austria:"at",Norway:"no",Canada:"ca",Paraguay:"py",Algeria:"dz",Egypt:"eg",Ghana:"gh","Cote d'Ivoire":"ci","Saudi Arabia":"sa",Qatar:"qa",Tunisia:"tn",Turkey:"tr","Czech Republic":"cz",Scotland:"gb-sct",Sweden:"se","South Africa":"za","New Zealand":"nz",Panama:"pa",Haiti:"ht","Curaçao":"cw","Cape Verde":"cv",Jordan:"jo",Uzbekistan:"uz",Iraq:"iq",Ecuador:"ec","DR Congo":"cd","Bosnia & Herzegovina":"ba"};

function enableAudio(){
  const music=document.getElementById('bgMusic');
  if(!musicStarted){
    music.play().catch(()=>{});
    musicStarted=true;
  }
}

// ===== COUNTDOWN =====
let countdownStarted = false;

function startCountdown(){
  if(countdownStarted) return;
  countdownStarted = true;

  enableAudio(); // start music immediately

  let screen = document.getElementById('countdownScreen');
  let timer = document.getElementById('countdownTimer');

  let sec = 60;

  timer.textContent = sec;

  let i = setInterval(()=>{
    sec--;
    timer.textContent = sec;

    if(sec <= 0){
      clearInterval(i);

      screen.style.opacity = 0;

      setTimeout(()=>{
        screen.style.display = 'none';
        drawNext(); // start draw
      },1000);
    }

  },1000);
}

// ===== SPIN =====
function spin(id,arr,final,cb){
  let el=document.getElementById(id);
  let t=0;
  let i=setInterval(()=>{
    el.textContent=arr[Math.floor(Math.random()*arr.length)];
    if(++t>=20){
      clearInterval(i);
      el.textContent=final;
      cb&&cb();
    }
  },100);
}

// ===== DRAW =====
function drawNext(){
  if(drawing||!players.length)return;
  drawing=true;

  let p=players.splice(Math.floor(Math.random()*players.length),1)[0];
  let a=potA.splice(Math.floor(Math.random()*potA.length),1)[0];
  let b=potB.splice(Math.floor(Math.random()*potB.length),1)[0];

  spin('playerWheel',players,p,()=>{
    spin('potAWheel',potA,a,()=>{
      spin('potBWheel',potB,b,()=>{

        count++;
        resultsBody.innerHTML+=`<tr><td>${count}</td><td>${p}</td><td>${a}</td><td>${b}</td></tr>`;
        progress.textContent=count;

        flashPlayer.textContent=p;
        flashPotA.textContent=a;
        flashPotB.textContent=b;
        flagA.src=`https://flagcdn.com/w80/${flags[a]}.png`;
        flagB.src=`https://flagcdn.com/w80/${flags[b]}.png`;

        let f=resultFlash;
        f.style.display='flex';
        setTimeout(()=>f.style.opacity=1,50);

        setTimeout(()=>{
          f.style.opacity=0;
          setTimeout(()=>{
            f.style.display='none';

            // CLEAR WHEELS
            playerWheel.textContent='—';
            potAWheel.textContent='—';
            potBWheel.textContent='—';

            drawing=false;

            if(players.length) drawNext();
            else finishDraw();

          },800);
        },3000);

      });
    });
  });
}

// ===== END =====
function finishDraw(){
  let end = document.getElementById('endMessage');

  end.style.opacity = 1;

setTimeout(()=>{
  end.style.opacity = 0;
  setTimeout(()=>{
    end.style.display = 'none';
  },1000);
},8000);
}

// ===== PDF =====
function downloadPDF(){
  html2pdf().from(document.getElementById('resultsTable')).save();
}

</script>

</body>
</html>
