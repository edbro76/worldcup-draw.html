<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerro Gordo World Cup Sweepstake Live Draw</title>

<style>
body{font-family:Arial;background:#2b2b2b;margin:0;padding:20px}
.container{max-width:1200px;margin:auto}
h1,h2{text-align:center;color:white}
.controls{display:flex;justify-content:center;gap:15px;margin:20px 0;}
button{padding:12px 24px;border:none;border-radius:10px;cursor:pointer;background:#ffd700;font-weight:bold;}
.wheels{display:flex;justify-content:center;gap:30px;margin:30px 0;}
.wheel{background:white;padding:25px 40px;border-radius:20px;text-align:center;min-width:220px;}
.value{font-size:30px;font-weight:bold;color:#0b3a75}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border:1px solid #ddd;text-align:center;}

#resultFlash{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);
  z-index:9999;color:white;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;opacity:0;transition:opacity 1s ease;
}
#flashPlayer{font-size:100px;color:#ffd700;margin-bottom:30px;}
.flashRow{display:flex;align-items:center;justify-content:center;gap:20px;font-size:60px;margin:10px 0;}
.flashRow img{height:80px;border-radius:5px;}

#countdownScreen{
  position:fixed;inset:0;background:#000;color:#ffd700;
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;z-index:10000;text-align:center;transition:opacity 1s;
}
</style>
</head>

<body>

<div class="container">
<h1>Cerro Gordo World Cup Sweepstake Live Draw</h1>
<div class="controls" id="startControls" style="display:none;">
<button onclick="drawNext()">Start Draw Manually</button>
</div>

<div class="wheels">
<div class="wheel"><div>Player</div><div id="playerWheel" class="value">—</div></div>
<div class="wheel"><div>Pot A</div><div id="potAWheel" class="value">—</div></div>
<div class="wheel"><div>Pot B</div><div id="potBWheel" class="value">—</div></div>
</div>

<h2>Draw Table (<span id="progress">0</span>/24)</h2>
<table>
<thead><tr><th>#</th><th>Player</th><th>Pot A</th><th>Pot B</th></tr></thead>
<tbody id="resultsBody"></tbody>
</table>
</div>

<div id="countdownScreen">
  <div id="countdownStatus" style="font-size:60px;margin-bottom:20px;">Draw Starts In</div>
  <div id="countdownTimer" style="font-size:90px;"></div>
</div>

<div id="resultFlash">
  <div id="flashPlayer"></div>
  <div class="flashRow"><img id="flagA"><div id="flashPotA"></div></div>
  <div class="flashRow"><img id="flagB"><div id="flashPotB"></div></div>
</div>

<audio id="bgMusic" loop><source src="themetune.mp3" type="audio/mpeg"></audio>

<script>
// ===== CONFIG & STATE =====
const drawDate = new Date(Date.now() + 10000); // 10s for testing
let phase = 1;
let musicStarted = false;
let count = 0;
let drawing = false;

const playersSeed=['Audrey','Ed','Liz','Andy','Carys','Mike','Steve B','Mary','June','Ray','Ian M','Margaret M','Jean','Elaine','Trevor','Sheila','Dave','Roy 1','Roy 2','Maria','Gill','Len','Fiona','Craig'];
const potASeed=['Argentina','Spain','France','England','Portugal','Brazil','Netherlands','Belgium','Germany','Croatia','Morocco','Colombia','Uruguay','Mexico','USA','Switzerland','Senegal','Japan','Iran','South Korea','Australia','Austria','Norway','Canada'];
const potBSeed=['Paraguay','Algeria','Egypt','Ghana',"Cote d'Ivoire",'Saudi Arabia','Qatar','Tunisia','Turkey','Czech Republic','Scotland','Sweden','South Africa','New Zealand','Panama','Haiti','Curaçao','Cape Verde','Jordan','Uzbekistan','Iraq','Ecuador','DR Congo','Bosnia & Herzegovina'];

let players = [...playersSeed], potA = [...potASeed], potB = [...potBSeed];

const flags={Argentina:"ar",Spain:"es",France:"fr",England:"gb-eng",Portugal:"pt",Brazil:"br",Netherlands:"nl",Belgium:"be",Germany:"de",Croatia:"hr",Morocco:"ma",Colombia:"co",Uruguay:"uy",Mexico:"mx",USA:"us",Switzerland:"ch",Senegal:"sn",Japan:"jp",Iran:"ir","South Korea":"kr",Australia:"au",Austria:"at",Norway:"no",Canada:"ca",Paraguay:"py",Algeria:"dz",Egypt:"eg",Ghana:"gh","Cote d'Ivoire":"ci","Saudi Arabia":"sa",Qatar:"qa",Tunisia:"tn",Turkey:"tr","Czech Republic":"cz",Scotland:"gb-sct",Sweden:"se","South Africa":"za","New Zealand":"nz",Panama:"pa",Haiti:"ht","Curaçao":"cw","Cape Verde":"cv",Jordan:"jo",Uzbekistan:"uz",Iraq:"iq",Ecuador:"ec","DR Congo":"cd","Bosnia & Herzegovina":"ba"};

const screen = document.getElementById('countdownScreen');
const timer = document.getElementById('countdownTimer');
const statusText = document.getElementById('countdownStatus');

// ===== UTILS =====
function randomItem(a) { return a[Math.floor(Math.random() * a.length)]; }

function spin(id, arr, finalValue, cb) {
  let t = 0, el = document.getElementById(id);
  let i = setInterval(() => {
    el.textContent = randomItem(arr);
    if (++t >= 20) { 
      clearInterval(i);
      el.textContent = finalValue;
      if (cb) cb();
    }
  }, 100);
}

// ===== CORE LOGIC =====
const timerInterval = setInterval(() => {
  if (phase === 1) {
    const diff = drawDate - Date.now();
    if (diff <= 0) {
      phase = 2;
      start20();
      return;
    }
    const s = Math.floor(diff / 1000);
    timer.textContent = s + "s";
  }
}, 100);

function start20() {
  statusText.textContent = "Final Countdown...";
  let sec = 20;
  timer.textContent = sec;

  let i = setInterval(() => {
    sec--;
    timer.textContent = sec;
    if (sec <= 0) {
      clearInterval(i);
      screen.style.opacity = 0;
      setTimeout(() => {
        screen.style.display = 'none';
        drawNext();
      }, 1000);
    }
  }, 1000);
}

function drawNext() {
  if (drawing || !players.length) return;
  
  const music = document.getElementById('bgMusic');
  if(!musicStarted) { 
    music.play().catch(e=>console.log("Music blocked until click")); 
    musicStarted=true; 
  }

  drawing = true;
  document.getElementById('resultFlash').style.display = 'none';

  let p = randomItem(players), a = randomItem(potA), b = randomItem(potB);

  spin('potBWheel', potB, b, () => {
        players = players.filter(x => x !== p);
        potA = potA.filter(x => x !== a);
        potB = potB.filter(x => x !== b);
        count++;

        document.getElementById('resultsBody').insertAdjacentHTML('beforeend', 
          `<tr><td>${count}</td><td>${p}</td><td>${a}</td><td>${b}</td></tr>`);
        document.getElementById('progress').textContent = count;

        // 1. Prepare data but keep elements hidden initially
        const flash = document.getElementById('resultFlash');
        const fPlayer = document.getElementById('flashPlayer');
        const fRowA = document.querySelector('.flashRow:nth-of-type(2)');
        const fRowB = document.querySelector('.flashRow:nth-of-type(3)');
        
        fPlayer.style.opacity = "0";
        fRowA.style.opacity = "0";
        fRowB.style.opacity = "0";

        document.getElementById('flashPlayer').textContent = p;
        document.getElementById('flashPotA').textContent = a;
        document.getElementById('flashPotB').textContent = b;
        document.getElementById('flagA').src = `https://flagcdn.com{flags[a]}.png`;
        document.getElementById('flagB').src = `https://flagcdn.com{flags[b]}.png`;

        // 2. Show the black overlay
        flash.style.display = 'flex';
        setTimeout(() => flash.style.opacity = '1', 50);

        // 3. Staggered Reveal (1 second apart)
        setTimeout(() => { fPlayer.style.opacity = "1"; fPlayer.style.transition = "opacity 0.5s"; }, 1000);
        setTimeout(() => { fRowA.style.opacity = "1"; fRowA.style.transition = "opacity 0.5s"; }, 2000);
        setTimeout(() => { fRowB.style.opacity = "1"; fRowB.style.transition = "opacity 0.5s"; }, 3000);

        // 4. Close flash screen after reveal is done
        setTimeout(() => {
          flash.style.opacity = '0';
          setTimeout(() => {
            flash.style.display = 'none';
            drawing = false;
            if (players.length > 0) drawNext();
          }, 1000);
        }, 3000); // Increased total time to allow for the slow reveal
      });
}
</script>
</body>
</html>
