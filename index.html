<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerro Gordo World Cup Sweepstake Live Draw</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#2b2b2b;
  margin:0;
  padding:20px;
}
.container{max-width:1200px;margin:auto}
h1,h2{text-align:center;color:white}

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:20px 0;
}
button{
  padding:12px 24px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

.wheels{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:30px 0;
}
.wheel{
  background:white;
  padding:25px 40px;
  border-radius:20px;
  text-align:center;
  min-width:220px;
}
.value{font-size:30px;font-weight:bold;color:#0b3a75}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}
th,td{
  padding:10px;
  border:1px solid #ddd;
}

/* FLASH */
#resultFlash{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:9999;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  transition:opacity 1s ease;
}

#flashPlayer{
  font-size:150px;
  color:#ffd700;
  margin-bottom:40px;
}

.flashRow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  font-size:90px;
}

.flashRow img{
  height:90px;
}

/* COUNTDOWN */
#countdownScreen{
  position:fixed;
  inset:0;
  background:#000;
  color:#ffd700;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10000;
  text-align:center;
  transition:opacity 1s;
}
</style>
</head>

<body>

<div class="container">
<h1>Cerro Gordo World Cup Sweepstake Live Draw</h1>

<div class="controls" id="startControls">
<button onclick="drawNext()">Start Draw</button>
</div>

<div class="wheels">
<div class="wheel"><div>Player</div><div id="playerWheel" class="value">—</div></div>
<div class="wheel"><div>Pot A</div><div id="potAWheel" class="value">—</div></div>
<div class="wheel"><div>Pot B</div><div id="potBWheel" class="value">—</div></div>
</div>

<h2>Draw Table (<span id="progress">0</span>/24)</h2>

<table>
<thead><tr><th>#</th><th>Player</th><th>Pot A</th><th>Pot B</th></tr></thead>
<tbody id="resultsBody"></tbody>
</table>

<div class="controls">
<button onclick="copyResults()">Copy Results</button>
</div>

</div>

<!-- COUNTDOWN -->
<div id="countdownScreen">
  <div style="font-size:60px;margin-bottom:20px;">Draw Starts In</div>
  <div id="countdownTimer" style="font-size:90px;"></div>
</div>

<!-- FLASH -->
<div id="resultFlash">
  <div id="flashPlayer"></div>

  <div class="flashRow">
    <img id="flagA">
    <div id="flashPotA"></div>
  </div>

  <div class="flashRow">
    <img id="flagB">
    <div id="flashPotB"></div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="themetune.mp3" type="audio/mpeg">
</audio>

<script>

// ===== COUNTDOWN =====
const drawDate = new Date("2026-05-24T19:00:00");
let phase = 1;

const screen = document.getElementById('countdownScreen');
const timer = document.getElementById('countdownTimer');

setInterval(()=>{
  const now = new Date();

  if(phase === 1){
    const diff = drawDate - now;

    if(diff <= 0){
      screen.style.opacity=0;

      setTimeout(()=>{
        phase=2;
        start20();
      },1000);

      return;
    }

    const d=Math.floor(diff/86400000);
    const h=Math.floor(diff/3600000)%24;
    const m=Math.floor(diff/60000)%60;
    const s=Math.floor(diff/1000)%60;

    timer.textContent=`${d}d ${h}h ${m}m ${s}s`;
  }
},1000);

function start20(){

  const music=document.getElementById('bgMusic');
  if(!musicStarted){music.play();musicStarted=true;}

  screen.style.opacity=1;
  screen.querySelector("div").textContent="Draw will start in 20 seconds";

  let sec=20;
  timer.textContent=sec;

  let i=setInterval(()=>{
    sec--;
    timer.textContent=sec;

    if(sec<=0){
      clearInterval(i);

      screen.style.opacity=0;

      setTimeout(()=>{
        screen.style.display='none';
        document.getElementById('startControls').style.display='none';
        drawNext();
      },1000);
    }
  },1000);
}

// ===== DATA =====
const playersSeed=[/* unchanged */];
const potASeed=[/* unchanged */];
const potBSeed=[/* unchanged */];

let players=[...playersSeed], potA=[...potASeed], potB=[...potBSeed];
let count=0, drawing=false, paused=false, musicStarted=false;

// FLAGS
const flags={/* unchanged */};

function randomItem(a){return a[Math.floor(Math.random()*a.length)]}

// SPIN
function spin(id,arr,val,cb){
let t=0,el=document.getElementById(id);
let i=setInterval(()=>{
el.textContent=randomItem(arr);
if(++t>=30){clearInterval(i);el.textContent=val;cb();}
},100);
}

// DRAW (UNCHANGED)
function drawNext(){
if(paused||drawing||!players.length)return;

['playerWheel','potAWheel','potBWheel'].forEach(id=>document.getElementById(id).textContent='—');

let music=document.getElementById('bgMusic');
if(!musicStarted){music.play();musicStarted=true;}

drawing=true;

let p=randomItem(players),a=randomItem(potA),b=randomItem(potB);

spin('playerWheel',players,p,()=>{
spin('potAWheel',potA,a,()=>{
spin('potBWheel',potB,b,()=>{

players=players.filter(x=>x!==p);
potA=potA.filter(x=>x!==a);
potB=potB.filter(x=>x!==b);
count++;

resultsBody.innerHTML+=`<tr><td>${count}</td><td>${p}</td><td>${a}</td><td>${b}</td></tr>`;
progress.textContent=count;

flashPlayer.textContent=p;
flashPotA.textContent=a;
flashPotB.textContent=b;

flagA.src=`https://flagcdn.com/w80/${flags[a]}.png`;
flagB.src=`https://flagcdn.com/w80/${flags[b]}.png`;

let f=resultFlash;
f.style.display='flex';
setTimeout(()=>f.style.opacity=1,50);

drawing=false;

setTimeout(()=>{
f.style.opacity=0;
setTimeout(()=>{
f.style.display='none';
if(players.length) drawNext(); else showComplete();
},1000);
},3000);

});
});
});
}

// COMPLETE / PAUSE / RESET / COPY (UNCHANGED)

</script>

</body>
</html>
