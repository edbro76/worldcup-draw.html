<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerro Gordo World Cup Sweepstake Live Draw</title>

<style>
body{font-family:Arial;background:#2b2b2b;margin:0;padding:20px}
.container{max-width:1200px;margin:auto}
h1,h2{text-align:center;color:white}

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:20px 0;
}
button{
  padding:12px 24px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.wheels{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:30px 0;
}
.wheel{
  background:white;
  padding:25px 40px;
  border-radius:20px;
  text-align:center;
  min-width:220px;
}
.value{font-size:30px;font-weight:bold;color:#0b3a75}

table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border:1px solid #ddd}

/* FLASH */
#resultFlash{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:9999;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  transition:opacity 1s ease;
}

#flashPlayer{
  font-size:140px;
  color:#ffd700;
  margin-bottom:30px;
}

.flashRow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  font-size:80px;
}

.flashRow img{height:80px}

/* COUNTDOWN */
#countdownScreen{
  position:fixed;
  inset:0;
  background:#000;
  color:#ffd700;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10000;
  text-align:center;
  transition:opacity 1s;
}
</style>
</head>

<body>

<div class="container">
<h1>Cerro Gordo World Cup Sweepstake Live Draw</h1>

<div class="controls" id="startControls">
<button onclick="drawNext()">Start Draw</button>
</div>

<div class="wheels">
<div class="wheel"><div>Player</div><div id="playerWheel" class="value">—</div></div>
<div class="wheel"><div>Pot A</div><div id="potAWheel" class="value">—</div></div>
<div class="wheel"><div>Pot B</div><div id="potBWheel" class="value">—</div></div>
</div>

<h2>Draw Table (<span id="progress">0</span>/24)</h2>

<table>
<thead><tr><th>#</th><th>Player</th><th>Pot A</th><th>Pot B</th></tr></thead>
<tbody id="resultsBody"></tbody>
</table>

<div class="controls">
<button onclick="copyResults()">Copy Results</button>
</div>

</div>

<!-- COUNTDOWN -->
<div id="countdownScreen">
  <div style="font-size:60px;margin-bottom:20px;">Draw Starts In</div>
  <div id="countdownTimer" style="font-size:90px;"></div>
</div>

<!-- FLASH -->
<div id="resultFlash">
  <div id="flashPlayer"></div>

  <div class="flashRow">
    <img id="flagA">
    <div id="flashPotA"></div>
  </div>

  <div class="flashRow">
    <img id="flagB">
    <div id="flashPotB"></div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="themetune.mp3" type="audio/mpeg">
</audio>

<script>

// ===== COUNTDOWN =====
const drawDate = new Date(Date.now() + 10000);
let phase = 1;

const screen = document.getElementById('countdownScreen');
const timer = document.getElementById('countdownTimer');

setInterval(()=>{
  const now = new Date();

  if(phase === 1){
    const diff = drawDate - now;

    if(diff <= 0){
      screen.style.opacity=0;

      setTimeout(()=>{
        phase=2;
        start20();
      },1000);

      return;
    }

    const d=Math.floor(diff/86400000);
    const h=Math.floor(diff/3600000)%24;
    const m=Math.floor(diff/60000)%60;
    const s=Math.floor(diff/1000)%60;

    timer.textContent=`${d}d ${h}h ${m}m ${s}s`;
  }
},1000);

function start20(){
  const music=document.getElementById('bgMusic');
  if(!musicStarted){music.play();musicStarted=true;}

  screen.style.opacity=1;
  screen.querySelector("div").textContent="Draw will start in 20 seconds";

  let sec=20;
  timer.textContent=sec;

  let i=setInterval(()=>{
    sec--;
    timer.textContent=sec;

    if(sec<=0){
      clearInterval(i);

      screen.style.opacity=0;

      setTimeout(()=>{
        screen.style.display='none';
        document.getElementById('startControls').style.display='none';
        drawNext();
      },1000);
    }
  },1000);
}

// ===== DATA =====
const playersSeed=['Audrey','Ed','Liz','Andy','Carys','Mike','Steve B','Mary','June','Ray','Ian M','Margaret M','Jean','Elaine','Trevor','Sheila','Dave','Roy 1','Roy 2','Maria','Gill','Len','Fiona','Craig'];

const potASeed=['Argentina','Spain','France','England','Portugal','Brazil','Netherlands','Belgium','Germany','Croatia','Morocco','Colombia','Uruguay','Mexico','USA','Switzerland','Senegal','Japan','Iran','South Korea','Australia','Austria','Norway','Canada'];

const potBSeed=['Paraguay','Algeria','Egypt','Ghana',"Cote d'Ivoire",'Saudi Arabia','Qatar','Tunisia','Turkey','Czech Republic','Scotland','Sweden','South Africa','New Zealand','Panama','Haiti','Curaçao','Cape Verde','Jordan','Uzbekistan','Iraq','Ecuador','DR Congo','Bosnia & Herzegovina'];

let players=[...playersSeed], potA=[...potASeed], potB=[...potBSeed];
let count=0, drawing=false, paused=false, musicStarted=false;

// FLAGS
const flags={Argentina:"ar",Spain:"es",France:"fr",England:"gb-eng",Portugal:"pt",Brazil:"br",Netherlands:"nl",Belgium:"be",Germany:"de",Croatia:"hr",Morocco:"ma",Colombia:"co",Uruguay:"uy",Mexico:"mx",USA:"us",Switzerland:"ch",Senegal:"sn",Japan:"jp",Iran:"ir","South Korea":"kr",Australia:"au",Austria:"at",Norway:"no",Canada:"ca",Paraguay:"py",Algeria:"dz",Egypt:"eg",Ghana:"gh","Cote d'Ivoire":"ci","Saudi Arabia":"sa",Qatar:"qa",Tunisia:"tn",Turkey:"tr","Czech Republic":"cz",Scotland:"gb-sct",Sweden:"se","South Africa":"za","New Zealand":"nz",Panama:"pa",Haiti:"ht","Curaçao":"cw","Cape Verde":"cv",Jordan:"jo",Uzbekistan:"uz",Iraq:"iq",Ecuador:"ec","DR Congo":"cd","Bosnia & Herzegovina":"ba"};

function rand(a){return a[Math.floor(Math.random()*a.length)]}
// SPIN
function spin(id, arr, finalValue, cb){
  let t=0, el=document.getElementById(id);
  let i=setInterval(()=>{
    el.textContent=randomItem(arr);
    if(++t>=30){
      clearInterval(i);
      el.textContent=finalValue;
      cb&&cb();
    }
  },100);
}
// DRAW
function drawNext(){
  if(paused || drawing || !players.length) return;

  document.getElementById('resultFlash').style.display='none';

  ['playerWheel','potAWheel','potBWheel'].forEach(id=>document.getElementById(id).textContent='—');

  let music=document.getElementById('bgMusic');
  if(!musicStarted){music.play();musicStarted=true;}

  drawing=true;

  let p=randomItem(players), a=randomItem(potA), b=randomItem(potB);

  spin('playerWheel',players,p,()=>{
    spin('potAWheel',potA,a,()=>{
      spin('potBWheel',potB,b,()=>{

        players=players.filter(x=>x!==p);
        potA=potA.filter(x=>x!==a);
        potB=potB.filter(x=>x!==b);
        count++;

        document.getElementById('resultsBody').insertAdjacentHTML('beforeend',
          `<tr><td>${count}</td><td>${p}</td><td>${a}</td><td>${b}</td></tr>`);

        document.getElementById('progress').textContent=count;

        document.getElementById('flashPlayer').textContent=p;
        document.getElementById('flashPotA').textContent=a;
        document.getElementById('flashPotB').textContent=b;

        document.getElementById('flagA').src=`https://flagcdn.com/w80/${flags[a]}.png`;
        document.getElementById('flagB').src=`https://flagcdn.com/w80/${flags[b]}.png`;

        const flash=document.getElementById('resultFlash');
        flash.style.display='flex';
        setTimeout(()=>flash.style.opacity='1',50);

        drawing=false;

        setTimeout(()=>{
          flash.style.opacity='0';
          setTimeout(()=>{
            flash.style.display='none';
            if(players.length>0){
              drawNext();
            }else{
              showComplete();
            }
          },1000);
        },3000);

      });
    });
  });
}

// FLASH
flashPlayer.textContent=p;
flashPotA.textContent=a;
flashPotB.textContent=b;
flagA.src=`https://flagcdn.com/w80/${flags[a]}.png`;
flagB.src=`https://flagcdn.com/w80/${flags[b]}.png`;

let f=resultFlash;
f.style.display='flex';
setTimeout(()=>f.style.opacity=1,50);

drawing=false;

setTimeout(()=>{
f.style.opacity=0;
setTimeout(()=>{
f.style.display='none';
if(players.length) drawNext(); else showComplete();
},1000);
},3000);

},3000);
},3000);
},3000);
}

// COMPLETE
function showComplete(){

  // wait 20 seconds after last draw
  setTimeout(()=>{

    const flash = document.getElementById('resultFlash');

    // set message
    document.getElementById('flashPlayer').textContent='🏆 DRAW COMPLETE';
    document.getElementById('flashPotA').textContent='';
    document.getElementById('flashPotB').textContent='';

    // show
    flash.style.display='flex';
    setTimeout(()=>flash.style.opacity='1',50);

    // stay visible 10 seconds
    setTimeout(()=>{

      // fade out
      flash.style.opacity='0';

      setTimeout(()=>{
        flash.style.display='none';
      },1000);

    },20000);

  },10000); // delay before showing

  // clear wheels
  document.getElementById('playerWheel').textContent='—';
  document.getElementById('potAWheel').textContent='—';
  document.getElementById('potBWheel').textContent='—';
}
// PAUSE
// PAUSE / RESUME
document.addEventListener('contextmenu', e=>{
  e.preventDefault();
  if(drawing) return;

  paused=!paused;
  const flash=document.getElementById('resultFlash');

  if(paused){
    document.getElementById('flashPlayer').textContent='⏸ PAUSED';
    document.getElementById('flashPotA').textContent='Right click to resume';
    document.getElementById('flashPotB').textContent='';
    flash.style.display='flex';
    flash.style.opacity='1';
  }else{
    flash.style.opacity='0';
    setTimeout(()=>{
      flash.style.display='none';
      if(players.length>0){
        drawNext();
      }
    },500);
  }
});

// RESET
document.addEventListener('keydown', e=>{
  if(e.key.toLowerCase()==='r'){

    if(!confirm('Reset draw?')) return;

    // reset data
    players=[...playersSeed];
    potA=[...potASeed];
    potB=[...potBSeed];
    count=0;
    paused=false;
    drawing=false;
    musicStarted=false;

    // stop music
    let music=document.getElementById('bgMusic');
    music.pause();
    music.currentTime=0;

    // clear table
    document.getElementById('resultsBody').innerHTML='';
    document.getElementById('progress').textContent='0';

    // reset wheels
    document.getElementById('playerWheel').textContent='—';
    document.getElementById('potAWheel').textContent='—';
    document.getElementById('potBWheel').textContent='—';

    // hide flash
    const flash=document.getElementById('resultFlash');
    flash.style.opacity='0';
    setTimeout(()=>flash.style.display='none',500);

    // show start button again
    document.getElementById('startControls').style.display='flex';

    // bring back countdown screen
    const screen=document.getElementById('countdownScreen');
    screen.style.display='flex';
    screen.style.opacity='1';

    // reset countdown phase
    phase = 1;
  }
});

// COPY
function copyResults(){
let text="Cerro Gordo World Cup Sweepstake Results\n\n";
document.querySelectorAll("#resultsBody tr").forEach(r=>{
let c=r.children;
text+=`${c[0].innerText}. ${c[1].innerText} - ${c[2].innerText} / ${c[3].innerText}\n`;
});
navigator.clipboard.writeText(text);
}

</script>

</body>
</html>
